name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Move files to correct locations
        run: |
          cp .github/workflows/build.gradle.kts ./
          cp .github/workflows/settings.gradle.kts ./
          cp .github/workflows/gradle.properties ./
          cp -r .github/workflows/gradle ./
          cp -r .github/workflows/app ./

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Pet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
